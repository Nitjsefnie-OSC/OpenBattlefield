# Runs the host showcase in game and PIE modes. Engine/build files stay on the runner.
name: osc-adv-ue-pie

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag or SHA to test
        required: true
        type: string
      mutant_refs:
        description: Optional whitespace-separated mutant branches, tags or SHAs
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Assemble matrix
        id: matrix
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          MUTANT_REFS: ${{ inputs.mutant_refs }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          target = os.environ['TARGET_REF']
          mutants = os.environ['MUTANT_REFS'].split()
          if not target or any(char.isspace() for char in target):
              raise SystemExit('target_ref must be one non-empty ref without whitespace')
          if len(mutants) > 63:
              raise SystemExit('at most 63 mutant refs fit the 256-job matrix')
          engines = [
              dict(ue='5.4', tag='dev-slim-5.4.4',
                   digest='sha256:17595d6ba844e543a05fc6550b590d71b46ddfbc58bec41987dc78c36828f090',
                   min_free_gib=40, showcase_args=''),
              # The 5.5 local Zen DDC server stalled the editor at startup.
              dict(ue='5.5', tag='dev-slim-5.5.4',
                   digest='sha256:8c460bfcd89609108a73127c44d8f680e533629f9306d1c6d30f17c4c3dab452',
                   min_free_gib=40, showcase_args='-ddc=InstalledNoZenLocalFallback'),
              dict(ue='5.6', tag='dev-slim-5.6.1',
                   digest='sha256:5e3e2f3e868963e266ec8dbb23eb7115eb20eff2c207182733842dc6bd0ba3de',
                   min_free_gib=50, showcase_args=''),
              dict(ue='5.7', tag='dev-slim-5.7.4',
                   digest='sha256:5d8fa43dbbc07ea53e6474c0f3ac33af092cc264070b0985a2d3e8c4697940f6',
                   min_free_gib=50, showcase_args=''),
          ]
          refs = [('target', target)] + [('mutant', ref) for ref in mutants]
          entries = [dict(engine, role=role, ref=ref, short_ref=ref[:12])
                     for engine in engines for role, ref in refs]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps({'include': entries}, separators=(',', ':')) + '\n')
          print(f'Matrix contains {len(entries)} engine/ref legs')
          PY

  # Assertion failures judge the target or mutant; infrastructure failures always fail the leg.
  ue:
    needs: prepare
    name: ue-${{ matrix.ue }}-${{ matrix.role }}-${{ matrix.short_ref }}
    runs-on: ubuntu-24.04
    environment: epic-ghcr
    permissions:
      contents: read
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/epicgames/unreal-engine@${{ matrix.digest }}
      ENGINE: /home/ue4/UnrealEngine
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
            /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/jvm
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          docker image prune -a -f > /dev/null
          df -h / /mnt || true

      - name: Place docker storage on the larger disk
        shell: bash
        run: |
          set -euo pipefail
          avail() { df --output=avail -B1G "$1" 2>/dev/null | tail -n 1 | tr -d ' ' || echo 0; }
          root_free=$(avail /)
          mnt_free=0
          if mountpoint -q /mnt; then mnt_free=$(avail /mnt); fi
          if [ "$mnt_free" -gt "$root_free" ]; then
            data_root=/mnt/docker
            work=/home/runner/work-ue
          else
            data_root=/var/lib/docker
            if [ "$mnt_free" -ge 15 ]; then work=/mnt/work-ue; else work=/home/runner/work-ue; fi
          fi
          sudo mkdir -p "$data_root" "$work"
          sudo chown 1000:1000 "$work"
          sudo python3 - "$data_root" <<'PY'
          import json, os, sys
          path = "/etc/docker/daemon.json"
          cfg = json.load(open(path)) if os.path.exists(path) else {}
          cfg["data-root"] = sys.argv[1]
          cfg.setdefault("features", {})["containerd-snapshotter"] = False
          json.dump(cfg, open(path, "w"), indent=2)
          PY
          sudo systemctl restart docker
          docker info --format 'docker storage: {{.Driver}} at {{.DockerRootDir}}'
          echo "WORK=$work" >> "$GITHUB_ENV"
          echo "DATA_ROOT=$data_root" >> "$GITHUB_ENV"

      - name: Disk gate
        shell: bash
        env:
          MIN_FREE_GIB: ${{ matrix.min_free_gib }}
        run: |
          set -euo pipefail
          df -h / /mnt || true
          free=$(df --output=avail -B1G "$DATA_ROOT" | tail -n 1 | tr -d ' ')
          echo "free on the docker disk: ${free} GiB (gate: ${MIN_FREE_GIB} GiB)"
          if [ "$free" -lt "$MIN_FREE_GIB" ]; then
            echo "::error::only ${free} GiB free for the engine image, below the ${MIN_FREE_GIB} GiB gate"
            exit 1
          fi

      - name: Pull the engine image (pinned by digest), then log out
        shell: bash
        env:
          EPIC_GHCR_PAT: ${{ secrets.EPIC_GHCR_PAT }}
          IMAGE_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$EPIC_GHCR_PAT" | docker login ghcr.io -u Nitjsefnie --password-stdin
          rc=0
          docker pull --quiet "$IMAGE" || rc=$?
          docker logout ghcr.io
          rm -f "$HOME/.docker/config.json"
          test ! -e "$HOME/.docker/config.json"
          if [ "$rc" -ne 0 ]; then echo "::error::docker pull failed ($rc)"; exit "$rc"; fi
          echo "engine image: $IMAGE_TAG"
          docker image inspect "$IMAGE" --format 'image digest: {{index .RepoDigests 0}}'
          docker image inspect "$IMAGE" --format 'image size: {{.Size}} bytes'
          df -h / /mnt || true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ matrix.ref }}
          path: src
          persist-credentials: false

      - name: Provenance
        id: provenance
        shell: bash
        working-directory: src
        env:
          TARGET_REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          echo "tested_target_ref=$TARGET_REF"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$checked_out_sha"
          printf 'checked_sha=%s\n' "$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Lay out the host project
        shell: bash
        run: |
          set -euo pipefail
          # Tools/UEHost/README.md layout: the repository copied to Tools/UEHost/Plugins/OpenBattlefield.
          sudo rsync -a --exclude .git src/ "$WORK/repo/"
          sudo mkdir -p "$WORK/repo/Tools/UEHost/Plugins"
          sudo rsync -a --exclude .git --exclude /Tools/UEHost/Plugins src/ \
            "$WORK/repo/Tools/UEHost/Plugins/OpenBattlefield/"
          sudo chown -R 1000:1000 "$WORK"
          sudo chmod -R a+rwX "$WORK"
          mkdir -p "$RUNNER_TEMP/ue-logs"
          echo "LOGS=$RUNNER_TEMP/ue-logs" >> "$GITHUB_ENV"
          docker run --rm --network none -u ue4 "$IMAGE" test -x "$ENGINE/Engine/Build/BatchFiles/Linux/Build.sh"

      - name: Build OBHostEditor Linux Development
        id: editor
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none -u ue4 -v "$WORK/repo:/work" "$IMAGE" \
            "$ENGINE/Engine/Build/BatchFiles/Linux/Build.sh" OBHostEditor Linux Development \
            -project=/work/Tools/UEHost/OBHost.uproject 2>&1 | tee "$LOGS/build-editor.log"

      - name: Headless showcase (-game -nullrhi)
        id: game
        if: ${{ !cancelled() && steps.editor.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SHOWCASE_ARGS: ${{ matrix.showcase_args }}
        run: |
          set -euo pipefail
          # The showcase can stall without exiting; retain the house workflow's 1200-second bound.
          rc=0
          # shellcheck disable=SC2086 # SHOWCASE_ARGS is a list of flags
          docker run --rm --network none -u ue4 -e LC_ALL=C -v "$WORK/repo:/work" "$IMAGE" \
            timeout --verbose --kill-after=60 1200 "$ENGINE/Engine/Binaries/Linux/UnrealEditor" \
            /work/Tools/UEHost/OBHost.uproject -game -nullrhi -unattended -nosound -nosplash -log -stdout \
            $SHOWCASE_ARGS > "$LOGS/game.log" 2>&1 || rc=$?
          timeout_check_rc=0
          timed_out=$(awk 'index($0, "timeout: sending signal TERM to command") {found=1}
            END {print found ? "yes" : "no"}' "$LOGS/game.log") || timeout_check_rc=$?
          if [ "$timeout_check_rc" -ne 0 ]; then timed_out=unavailable; fi
          echo "game editor exit status (docker/timeout): $rc; timeout fired: $timed_out"
          echo "--- game OBShowcase lines ---"
          awk '/OBShowcase:/ {print}' "$LOGS/game.log"
          echo "--- game errors (maximum 100) ---"
          awk 'tolower($0) ~ /error:|fatal|assertion failed/ {
            count++; if (count <= 100) print
          } END {if (count > 100) printf "truncated: printed 100 of %d matching lines\n", count}' "$LOGS/game.log"
          echo "--- last 60 game log lines ---"
          tail -n 60 "$LOGS/game.log"
          if [ "$timeout_check_rc" -ne 0 ]; then
            echo "::error::could not inspect game timeout diagnostic"
            exit "$timeout_check_rc"
          fi
          echo "exit_status=$rc" >> "$GITHUB_OUTPUT"
          echo "timed_out=$timed_out" >> "$GITHUB_OUTPUT"

      - name: PIE automation showcase
        id: pie
        if: ${{ !cancelled() && steps.editor.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SHOWCASE_ARGS: ${{ matrix.showcase_args }}
        run: |
          set -euo pipefail
          # Fifteen minutes bounds editor startup plus the candidate's 60-second PIE test.
          rc=0
          # shellcheck disable=SC2086 # SHOWCASE_ARGS is a list of flags
          docker run --rm --network none -u ue4 -e LC_ALL=C -v "$WORK/repo:/work" "$IMAGE" \
            timeout --verbose --kill-after=60 900 "$ENGINE/Engine/Binaries/Linux/UnrealEditor" \
            /work/Tools/UEHost/OBHost.uproject -nullrhi -unattended -nosound -nosplash -log -stdout -FullStdOutLogOutput \
            $SHOWCASE_ARGS '-ExecCmds=Automation RunTests Project.Maps.PIE' '-TestExit=Automation Test Queue Empty' \
            > "$LOGS/pie.log" 2>&1 || rc=$?
          timeout_check_rc=0
          timed_out=$(awk 'index($0, "timeout: sending signal TERM to command") {found=1}
            END {print found ? "yes" : "no"}' "$LOGS/pie.log") || timeout_check_rc=$?
          if [ "$timeout_check_rc" -ne 0 ]; then timed_out=unavailable; fi
          echo "PIE editor exit status (docker/timeout): $rc; timeout fired: $timed_out"
          echo "--- PIE OBShowcase lines ---"
          awk '/OBShowcase:/ {print}' "$LOGS/pie.log"
          echo "--- automation lines (maximum 200) ---"
          awk 'tolower($0) ~ /automation|test completed|result=/ {
            count++; if (count <= 200) print
          } END {if (count > 200) printf "truncated: printed 200 of %d matching lines\n", count}' "$LOGS/pie.log"
          echo "--- PIE world candidate lines (maximum 200) ---"
          awk 'tolower($0) ~ /pie|playlevel|play in editor|worldtype/ {
            count++; if (count <= 200) print
          } END {if (count > 200) printf "truncated: printed 200 of %d matching lines\n", count}' "$LOGS/pie.log"
          echo "--- PIE errors (maximum 100) ---"
          awk 'tolower($0) ~ /error:|fatal|assertion failed/ {
            count++; if (count <= 100) print
          } END {if (count > 100) printf "truncated: printed 100 of %d matching lines\n", count}' "$LOGS/pie.log"
          echo "--- last 60 PIE log lines ---"
          tail -n 60 "$LOGS/pie.log"
          if [ "$timeout_check_rc" -ne 0 ]; then
            echo "::error::could not inspect PIE timeout diagnostic"
            exit "$timeout_check_rc"
          fi
          echo "exit_status=$rc" >> "$GITHUB_OUTPUT"
          echo "timed_out=$timed_out" >> "$GITHUB_OUTPUT"

      - name: Assert showcase behavior
        id: assertions
        if: ${{ !cancelled() && steps.editor.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GAME_EXIT: ${{ steps.game.outputs.exit_status }}
          GAME_TIMEOUT: ${{ steps.game.outputs.timed_out }}
          PIE_EXIT: ${{ steps.pie.outputs.exit_status }}
          PIE_TIMEOUT: ${{ steps.pie.outputs.timed_out }}
        run: |
          set -uo pipefail
          game_log="$LOGS/game.log"
          pie_log="$LOGS/pie.log"
          : > "$LOGS/assertions.txt" || exit 1
          failed_count=0
          failed_names=''
          broken=0
          check() {
            local name="$1" detail code=0 result
            shift
            detail=$("$@" 2>&1) || code=$?
            if [ "$code" -eq 0 ]; then
              result=PASS
            else
              result=FAIL
              failed_count=$((failed_count + 1))
              failed_names="${failed_names:+$failed_names,}$name"
              if [ "$code" -ne 1 ]; then broken=1; fi
            fi
            printf '%s: %s\n' "$result" "$name" || broken=1
            printf '%s\n' "$detail" || broken=1
            printf '%s %s\n' "$name" "$result" >> "$LOGS/assertions.txt" || broken=1
          }
          record_prefix='^([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9:.]+Z[[:space:]]+)?\[[0-9.:-]+\]\[[[:space:]]*[0-9]+[[:space:]]*\]'
          showcase_records() {
            if [ ! -r "$1" ]; then echo "log unavailable: $1"; return 2; fi
            grep -aE -- "${record_prefix}LogTemp: ${2}: OBShowcase: ${3}"$'\r?$' "$1"
          }
          three_craters() {
            local matched line code count=0 passed=0
            matched=$(showcase_records "$1" Display 'after crater .*') || {
              code=$?; if [ "$code" -ne 1 ]; then return 2; fi
            }
            if [ -n "$matched" ]; then printf '%s\n' "$matched" || return 2; fi
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                count=$((count + 1))
                line=${line%$'\r'}
                if [[ "$line" =~ [[:space:]]PASS$ ]]; then passed=$((passed + 1)); fi
              fi
            done <<< "$matched"
            if [ "$count" -ne 3 ] || [ "$passed" -ne 3 ]; then
              printf 'expected 3 crater records ending in PASS, found %d records and %d PASS\n' "$count" "$passed"
              return 1
            fi
          }
          has_line() {
            local code
            if showcase_records "$1" Display "$2"; then return 0; else code=$?; fi
            if [ "$code" -eq 1 ]; then echo "no showcase line matching: $2"; return 1; fi
            return 2
          }
          has_no_line() {
            local code
            if showcase_records "$1" '[[:alpha:]]+' "$2"; then echo "unexpected failure line above"; return 1; else code=$?; fi
            if [ "$code" -eq 1 ]; then echo "no failure line: $2"; return 0; fi
            return 2
          }
          exit_ok() {
            case "$2" in ''|*[!0-9]*) echo "$1 exit status unavailable"; return 2 ;; esac
            case "$3" in yes|no) ;; *) echo "$1 timeout status unavailable"; return 2 ;; esac
            printf '%s exit status: %s; timeout fired: %s\n' "$1" "$2" "$3"
            [ "$2" -eq 0 ] && [ "$3" = no ]
          }
          game_done() {
            local fail=0 problem=0 code needle
            if has_line "$game_log" 'done'; then :; else
              code=$?; if [ "$code" -eq 1 ]; then fail=1; else problem=1; fi
            fi
            if exit_ok 'Run G' "$GAME_EXIT" "$GAME_TIMEOUT"; then :; else
              code=$?; if [ "$code" -eq 1 ]; then fail=1; else problem=1; fi
            fi
            for needle in 'terrain never finished.*' '.*no ground at the start point'; do
              if has_no_line "$game_log" "$needle"; then :; else
                code=$?; if [ "$code" -eq 1 ]; then fail=1; else problem=1; fi
              fi
            done
            if [ "$problem" -ne 0 ]; then return 2; fi
            [ "$fail" -eq 0 ]
          }
          automation_done() {
            local detail
            if [ ! -r "$1" ]; then echo "log unavailable: $1"; return 2; fi
            detail=$(awk -v prefix="$record_prefix" '
              function field(token, value) {
                if (token ~ /^Path=[{][^{}]*[}]$/) {
                  paths++; value=substr(token, 7, length(token)-7)
                  if (value == "Project.Maps.PIE") target=1
                }
                if (token ~ /^Result=[{][^{}]*[}]$/) {
                  results++; value=substr(token, 9, length(token)-9)
                  if (value == "Success") success=1
                }
              }
              index($0, "Test Completed.") || index($0, "TEST COMPLETE. EXIT CODE:") {print}
              $0 ~ (prefix "LogAutomationController: [[:alpha:]]+: Test Completed[.]([[:space:]]|$)") {
                message=$0
                sub(prefix "LogAutomationController: [[:alpha:]]+: Test Completed[.][[:space:]]*", "", message)
                paths=results=target=success=depth=0; token=""
                # Split only at top-level whitespace; nested context is not a result/path field.
                for (i=1; i<=length(message); i++) {
                  char=substr(message, i, 1)
                  if (char ~ /[[:space:]]/ && depth == 0) {
                    if (token != "") field(token)
                    token=""
                  } else {
                    if (char == "{") depth++
                    if (char == "}") depth--
                    token=token char
                  }
                }
                if (token != "") field(token)
                if (target) {
                  if (depth != 0 || paths != 1 || results != 1 || !success) target_failed=1
                  else result=1
                }
              }
              $0 ~ (prefix "LogAutomationCommandLine: [[:alpha:]]+: .*TEST COMPLETE[.] EXIT CODE: [-+]?[0-9]+") {
                message=$0
                while (match(message, /TEST COMPLETE[.] EXIT CODE: [-+]?[0-9]+/)) {
                  code=substr(message, RSTART, RLENGTH)
                  message=substr(message, RSTART+RLENGTH)
                  sub(/^TEST COMPLETE[.] EXIT CODE: /, "", code)
                  if (code+0 != 0) queue_failed=1
                }
              }
              $0 ~ (prefix "LogAutomationCommandLine: [[:alpha:]]+: [*][*][*][*] TEST COMPLETE[.] EXIT CODE: 0 [*][*][*][*][[:space:]]*$") {
                if (result) queue=1
              }
              END {
                if (!result) print "missing successful Project.Maps.PIE Test Completed record"
                if (!queue) print "missing later TEST COMPLETE. EXIT CODE: 0 record"
                if (target_failed) print "failed or ambiguous Project.Maps.PIE result"
                if (queue_failed) print "nonzero automation queue completion"
                printf "automation result flags: %d %d %d %d\n", result, queue, target_failed, queue_failed
              }' "$1") || return 2
            printf '%s\n' "$detail" || return 2
            case "$detail" in *'automation result flags: 1 1 0 0') return 0 ;; *) return 1 ;; esac
          }
          is_pie_world() {
            showcase_records "$1" Display 'world type PIE'
          }
          world_markers() {
            local fail=0 problem=0 code
            if is_pie_world "$pie_log"; then :; else
              code=$?; if [ "$code" -eq 1 ]; then echo 'PIE marker absent from Run P'; fail=1; else problem=1; fi
            fi
            if is_pie_world "$game_log"; then
              echo 'PIE marker unexpectedly present in Run G'; fail=1
            else
              code=$?; if [ "$code" -ne 1 ]; then problem=1; else echo 'PIE marker absent from Run G'; fi
            fi
            if has_line "$game_log" 'world type Game'; then :; else
              code=$?; if [ "$code" -eq 1 ]; then fail=1; else problem=1; fi
            fi
            if [ "$problem" -ne 0 ]; then return 2; fi
            [ "$fail" -eq 0 ]
          }
          check G1 three_craters "$game_log"
          check G2 has_line "$game_log" 'collision follows craters: 3/3'
          check G3 has_line "$game_log" 'character walks: 2/2'
          check G4 game_done
          check P1 three_craters "$pie_log"
          check P2 has_line "$pie_log" 'collision follows craters: 3/3'
          check P3 has_line "$pie_log" 'character walks: 2/2'
          check P4 has_line "$pie_log" 'done'
          check P5 exit_ok 'Run P' "$PIE_EXIT" "$PIE_TIMEOUT"
          check P6 automation_done "$pie_log"
          check M world_markers
          printf 'failed_count=%s\nfailed_names=%s\n' "$failed_count" "$failed_names" >> "$GITHUB_OUTPUT" || broken=1
          if [ "$broken" -ne 0 ]; then exit 1; fi

      - name: Summarize assertions
        id: summary
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          UE_VERSION: ${{ matrix.ue }}
          ROLE: ${{ matrix.role }}
          TARGET_REF: ${{ matrix.ref }}
          CHECKED_SHA: ${{ steps.provenance.outputs.checked_sha }}
          EDITOR_OUTCOME: ${{ steps.editor.outcome }}
          GAME_OUTCOME: ${{ steps.game.outcome }}
          PIE_OUTCOME: ${{ steps.pie.outcome }}
          ASSERT_OUTCOME: ${{ steps.assertions.outcome }}
          GAME_EXIT: ${{ steps.game.outputs.exit_status }}
          PIE_EXIT: ${{ steps.pie.outputs.exit_status }}
          FAILED_COUNT: ${{ steps.assertions.outputs.failed_count }}
          FAILED_NAMES: ${{ steps.assertions.outputs.failed_names }}
        run: |
          set -euo pipefail
          valid_status() { case "$1" in ''|*[!0-9]*|125|126|127) return 1 ;; *) return 0 ;; esac; }
          {
            printf '### UE %s — %s\n' "$UE_VERSION" "$ROLE"
            printf -- '- Ref: %s\n- Checked-out SHA: %s\n' "$TARGET_REF" "${CHECKED_SHA:-unavailable}"
            for name in G1 G2 G3 G4 P1 P2 P3 P4 P5 P6 M; do
              result='not available'
              if [ -n "${LOGS:-}" ] && [ -f "$LOGS/assertions.txt" ]; then
                result=$(awk -v name="$name" '$1 == name {print $2; exit}' "$LOGS/assertions.txt")
                result=${result:-not available}
              fi
              printf -- '- %s: %s\n' "$name" "$result"
            done
            if [ "$ROLE" = mutant ]; then
              if [ "$EDITOR_OUTCOME" = success ] && [ "$GAME_OUTCOME" = success ] && \
                 [ "$PIE_OUTCOME" = success ] && [ "$ASSERT_OUTCOME" = success ] && \
                 valid_status "$GAME_EXIT" && valid_status "$PIE_EXIT" && [[ "$FAILED_COUNT" =~ ^[0-9]+$ ]]; then
                if [ "$FAILED_COUNT" -gt 0 ]; then
                  printf -- '- Mutant verdict: KILLED (%s)\n' "$FAILED_NAMES"
                else
                  echo '- Mutant verdict: SURVIVED'
                fi
              else
                echo '- Mutant verdict: INFRASTRUCTURE FAILURE'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check infrastructure and verdict
        if: ${{ always() }}
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
          EDITOR_OUTCOME: ${{ steps.editor.outcome }}
          GAME_OUTCOME: ${{ steps.game.outcome }}
          PIE_OUTCOME: ${{ steps.pie.outcome }}
          ASSERT_OUTCOME: ${{ steps.assertions.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          GAME_EXIT: ${{ steps.game.outputs.exit_status }}
          PIE_EXIT: ${{ steps.pie.outputs.exit_status }}
          FAILED_COUNT: ${{ steps.assertions.outputs.failed_count }}
          FAILED_NAMES: ${{ steps.assertions.outputs.failed_names }}
        run: |
          set -euo pipefail
          infra=0
          if [ "$EDITOR_OUTCOME" != success ]; then
            echo "::error::editor build did not succeed ($EDITOR_OUTCOME)"
            infra=1
          else
            for entry in "game:$GAME_OUTCOME:$GAME_EXIT" "PIE:$PIE_OUTCOME:$PIE_EXIT"; do
              IFS=: read -r name outcome status <<< "$entry"
              if [ "$outcome" != success ]; then
                echo "::error::$name evidence step did not complete successfully ($outcome)"
                infra=1
              fi
              # Docker/timeout reserve 125 for their own failures and 126/127 for commands that cannot run.
              # An editor deliberately exiting 125–127 is indistinguishable and will also be classified as a launch failure.
              case "$status" in
                125|126|127) echo "::error::$name container or timeout launch failed ($status)"; infra=1 ;;
                ''|*[!0-9]*) echo "::error::$name exit status unavailable or invalid"; infra=1 ;;
              esac
            done
            if [ "$ASSERT_OUTCOME" != success ]; then
              echo "::error::assertion evidence step did not complete successfully ($ASSERT_OUTCOME)"
              infra=1
            fi
            case "$FAILED_COUNT" in ''|*[!0-9]*) echo '::error::assertion count unavailable or invalid'; infra=1 ;; esac
            if [ "${FAILED_COUNT:-0}" != 0 ] && [ -z "$FAILED_NAMES" ]; then
              echo '::error::failed assertion names unavailable'; infra=1
            fi
          fi
          if [ "$SUMMARY_OUTCOME" != success ]; then
            echo "::error::summary step did not complete successfully ($SUMMARY_OUTCOME)"
            infra=1
          fi
          if [ "$infra" -ne 0 ]; then echo 'INFRASTRUCTURE FAILURE'; exit 1; fi
          case "$ROLE" in
            target)
              if [ "$FAILED_COUNT" -ne 0 ]; then echo "Target FAIL: $FAILED_NAMES"; exit 1; fi
              echo 'Target PASS'
              ;;
            mutant)
              if [ "$FAILED_COUNT" -ne 0 ]; then echo "KILLED: $FAILED_NAMES"; else echo 'SURVIVED'; exit 1; fi
              ;;
            *) echo "::error::unknown role: $ROLE"; exit 1 ;;
          esac
