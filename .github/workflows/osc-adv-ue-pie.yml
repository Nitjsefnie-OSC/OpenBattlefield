# Builds the plugin in the UEHost project on Linux inside Epic's dev-slim engine images and runs the
# headless showcase. Fork default branch only. Nothing from the image or the build tree is uploaded:
# no artifacts, no caches, no registry push. The pull credential exists only before the candidate is
# checked out.
name: osc-adv-ue-pie

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag or SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  # A leg fails only on infrastructure failure; editor runs report evidence without judging it.
  ue:
    name: ue-${{ matrix.ue }}
    runs-on: ubuntu-24.04
    environment: epic-ghcr
    permissions:
      contents: read
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - ue: "5.4"
            tag: dev-slim-5.4.4
            digest: sha256:17595d6ba844e543a05fc6550b590d71b46ddfbc58bec41987dc78c36828f090
            min_free_gib: 40
            ubt_result_line: false
          - ue: "5.5"
            tag: dev-slim-5.5.4
            digest: sha256:8c460bfcd89609108a73127c44d8f680e533629f9306d1c6d30f17c4c3dab452
            min_free_gib: 40
            ubt_result_line: false
            # 5.5's local Zen DDC server left the editor polling it at frame 0; use a Zen-free DDC graph.
            showcase_args: -ddc=InstalledNoZenLocalFallback
          - ue: "5.6"
            tag: dev-slim-5.6.1
            digest: sha256:5e3e2f3e868963e266ec8dbb23eb7115eb20eff2c207182733842dc6bd0ba3de
            min_free_gib: 50
            ubt_result_line: true
          - ue: "5.7"
            tag: dev-slim-5.7.4
            digest: sha256:5d8fa43dbbc07ea53e6474c0f3ac33af092cc264070b0985a2d3e8c4697940f6
            min_free_gib: 50
            ubt_result_line: true
    env:
      IMAGE: ghcr.io/epicgames/unreal-engine@${{ matrix.digest }}
      ENGINE: /home/ue4/UnrealEngine
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
            /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/jvm
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          docker image prune -a -f > /dev/null
          df -h / /mnt || true

      - name: Place docker storage on the larger disk
        shell: bash
        run: |
          set -euo pipefail
          avail() { df --output=avail -B1G "$1" 2>/dev/null | tail -n 1 | tr -d ' ' || echo 0; }
          root_free=$(avail /)
          mnt_free=0
          if mountpoint -q /mnt; then mnt_free=$(avail /mnt); fi
          if [ "$mnt_free" -gt "$root_free" ]; then
            data_root=/mnt/docker
            work=/home/runner/work-ue
          else
            data_root=/var/lib/docker
            if [ "$mnt_free" -ge 15 ]; then work=/mnt/work-ue; else work=/home/runner/work-ue; fi
          fi
          sudo mkdir -p "$data_root" "$work"
          sudo chown 1000:1000 "$work"
          sudo python3 - "$data_root" <<'PY'
          import json, os, sys
          path = "/etc/docker/daemon.json"
          cfg = json.load(open(path)) if os.path.exists(path) else {}
          cfg["data-root"] = sys.argv[1]
          cfg.setdefault("features", {})["containerd-snapshotter"] = False
          json.dump(cfg, open(path, "w"), indent=2)
          PY
          sudo systemctl restart docker
          docker info --format 'docker storage: {{.Driver}} at {{.DockerRootDir}}'
          echo "WORK=$work" >> "$GITHUB_ENV"
          echo "DATA_ROOT=$data_root" >> "$GITHUB_ENV"

      - name: Disk gate
        shell: bash
        env:
          MIN_FREE_GIB: ${{ matrix.min_free_gib }}
        run: |
          set -euo pipefail
          df -h / /mnt || true
          free=$(df --output=avail -B1G "$DATA_ROOT" | tail -n 1 | tr -d ' ')
          echo "free on the docker disk: ${free} GiB (gate: ${MIN_FREE_GIB} GiB)"
          if [ "$free" -lt "$MIN_FREE_GIB" ]; then
            echo "::error::only ${free} GiB free for the engine image, below the ${MIN_FREE_GIB} GiB gate"
            exit 1
          fi

      - name: Pull the engine image (pinned by digest), then log out
        shell: bash
        env:
          EPIC_GHCR_PAT: ${{ secrets.EPIC_GHCR_PAT }}
        run: |
          set -euo pipefail
          printf '%s' "$EPIC_GHCR_PAT" | docker login ghcr.io -u Nitjsefnie --password-stdin
          rc=0
          docker pull --quiet "$IMAGE" || rc=$?
          docker logout ghcr.io
          rm -f "$HOME/.docker/config.json"
          test ! -e "$HOME/.docker/config.json"
          if [ "$rc" -ne 0 ]; then echo "::error::docker pull failed ($rc)"; exit "$rc"; fi
          echo "engine image: ${{ matrix.tag }}"
          docker image inspect "$IMAGE" --format 'image digest: {{index .RepoDigests 0}}'
          docker image inspect "$IMAGE" --format 'image size: {{.Size}} bytes'
          df -h / /mnt || true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.target_ref }}
          path: src
          persist-credentials: false

      - name: Provenance
        shell: bash
        working-directory: src
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          echo "tested_target_ref=$TARGET_REF"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$checked_out_sha"

      - name: Lay out the host project
        shell: bash
        run: |
          set -euo pipefail
          # Tools/UEHost/README.md layout: the repository copied to Tools/UEHost/Plugins/OpenBattlefield.
          sudo rsync -a --exclude .git src/ "$WORK/repo/"
          sudo mkdir -p "$WORK/repo/Tools/UEHost/Plugins"
          sudo rsync -a --exclude .git --exclude /Tools/UEHost/Plugins src/ \
            "$WORK/repo/Tools/UEHost/Plugins/OpenBattlefield/"
          sudo chown -R 1000:1000 "$WORK"
          sudo chmod -R a+rwX "$WORK"
          mkdir -p "$RUNNER_TEMP/ue-logs"
          echo "LOGS=$RUNNER_TEMP/ue-logs" >> "$GITHUB_ENV"
          docker run --rm --network none -u ue4 "$IMAGE" test -x "$ENGINE/Engine/Build/BatchFiles/Linux/Build.sh"

      - name: Build OBHostEditor Linux Development
        id: editor
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none -u ue4 -v "$WORK/repo:/work" "$IMAGE" \
            "$ENGINE/Engine/Build/BatchFiles/Linux/Build.sh" OBHostEditor Linux Development \
            -project=/work/Tools/UEHost/OBHost.uproject 2>&1 | tee "$LOGS/build-editor.log"

      - name: List automation tests
        id: list
        if: ${{ !cancelled() && steps.editor.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SHOWCASE_ARGS: ${{ matrix.showcase_args }}
        run: |
          set -euo pipefail
          # Allow ten minutes for editor startup and test discovery; bound a stalled editor.
          rc=0
          # shellcheck disable=SC2086 # SHOWCASE_ARGS is a list of flags
          docker run --rm --network none -u ue4 -e LC_ALL=C -v "$WORK/repo:/work" "$IMAGE" \
            timeout --verbose --kill-after=60 600 "$ENGINE/Engine/Binaries/Linux/UnrealEditor" \
            /work/Tools/UEHost/OBHost.uproject -nullrhi -unattended -nosound -nosplash -log -stdout -FullStdOutLogOutput \
            $SHOWCASE_ARGS '-ExecCmds=Automation List; Quit' > "$LOGS/list.log" 2>&1 || rc=$?
          echo "exit_status=$rc" >> "$GITHUB_OUTPUT"

          tr -d '\r' < "$LOGS/list.log" | sed -nE \
            "s/^.*LogAutomationCommandLine:.*Display:[[:space:]]*'([^']+)'[[:space:]]*$/\1/p" \
            > "$LOGS/listed-tests.txt"
          awk '/\.Maps\.PIE$/ {print}' "$LOGS/listed-tests.txt" > "$LOGS/pie-tests.txt"
          echo "listing editor exit status (docker/timeout): $rc"
          echo "listed tests parsed: $(wc -l < "$LOGS/listed-tests.txt")"
          awk '/LogAutomationCommandLine:.*Found [0-9]+ Automation Tests/ {print}' "$LOGS/list.log"
          echo "--- listing lines matching PIE ---"
          awk 'tolower($0) ~ /pie/ {print}' "$LOGS/list.log"
          echo "--- last 40 listing log lines ---"
          tail -n 40 "$LOGS/list.log"

      - name: Run PIE map test
        id: pie
        if: ${{ !cancelled() && steps.editor.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SHOWCASE_ARGS: ${{ matrix.showcase_args }}
        run: |
          set -euo pipefail
          if [ -s "$LOGS/pie-tests.txt" ]; then
            IFS= read -r pie_test < "$LOGS/pie-tests.txt"
            echo "PIE test from listing: $pie_test"
          else
            pie_test=Project.Maps.PIE
            echo "No PIE map test found in listing; using fallback: $pie_test"
          fi

          # Command-line config overrides do not support arrays; configure the copied project too.
          cat >> "$WORK/repo/Tools/UEHost/Config/DefaultEngine.ini" <<'INI'

          [/Script/Engine.AutomationTestSettings]
          !MapsToPIETest=ClearArray
          +MapsToPIETest=/Engine/Maps/Templates/Template_Default
          PIETestDuration=180
          INI

          # Three minutes gives the under-one-minute showcase time to finish; fifteen minutes bounds startup and PIE.
          rc=0
          # shellcheck disable=SC2086 # SHOWCASE_ARGS is a list of flags
          docker run --rm --network none -u ue4 -e LC_ALL=C -v "$WORK/repo:/work" "$IMAGE" \
            timeout --verbose --kill-after=60 900 "$ENGINE/Engine/Binaries/Linux/UnrealEditor" \
            /work/Tools/UEHost/OBHost.uproject -nullrhi -unattended -nosound -nosplash -log -stdout -FullStdOutLogOutput \
            $SHOWCASE_ARGS "-ExecCmds=Automation RunTests $pie_test" '-TestExit=Automation Test Queue Empty' \
            '-ini:Engine:[/Script/Engine.AutomationTestSettings]:MapsToPIETest=/Engine/Maps/Templates/Template_Default,[/Script/Engine.AutomationTestSettings]:PIETestDuration=180' \
            > "$LOGS/pie.log" 2>&1 || rc=$?
          timed_out=no
          if grep -Fq 'timeout: sending signal TERM to command' "$LOGS/pie.log"; then timed_out=yes; fi
          echo "exit_status=$rc" >> "$GITHUB_OUTPUT"
          echo "timed_out=$timed_out" >> "$GITHUB_OUTPUT"
          echo "PIE editor exit status (docker/timeout): $rc; timeout fired: $timed_out"
          echo "--- OBShowcase lines ---"
          awk '/OBShowcase:/ {print}' "$LOGS/pie.log"
          echo "--- automation and PIE lines (maximum 200) ---"
          awk 'tolower($0) ~ /automation|test completed|result=|pie|playlevel|play in editor|worldtype/ {
            count++; if (count <= 200) print
          } END {if (count > 200) printf "truncated: printed 200 of %d matching lines\n", count}' "$LOGS/pie.log"
          echo "--- errors (maximum 100) ---"
          awk 'tolower($0) ~ /error:|fatal|assertion failed/ {
            count++; if (count <= 100) print
          } END {if (count > 100) printf "truncated: printed 100 of %d matching lines\n", count}' "$LOGS/pie.log"
          echo "--- last 60 PIE log lines ---"
          tail -n 60 "$LOGS/pie.log"

      - name: Summarize probe
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          UE_VERSION: ${{ matrix.ue }}
          LIST_EXIT: ${{ steps.list.outputs.exit_status }}
          PIE_EXIT: ${{ steps.pie.outputs.exit_status }}
          PIE_TIMEOUT: ${{ steps.pie.outputs.timed_out }}
        run: |
          set -euo pipefail
          {
            printf '### UE %s\n' "$UE_VERSION"
            printf -- '- Listing editor exit status (docker/timeout): %s\n' "${LIST_EXIT:-not run}"
            if [ -n "${LOGS:-}" ] && [ -s "$LOGS/pie-tests.txt" ]; then
              echo '- PIE test names found:'
              while IFS= read -r name; do printf '  - %s\n' "$name"; done < "$LOGS/pie-tests.txt"
            elif [ -n "${LOGS:-}" ] && [ -f "$LOGS/pie-tests.txt" ]; then
              echo '- PIE test names found: none'
            else
              echo '- PIE test names found: not available'
            fi
            printf -- '- PIE editor exit status (docker/timeout): %s\n' "${PIE_EXIT:-not run}"
            printf -- '- PIE timeout fired: %s\n' "${PIE_TIMEOUT:-not run}"
            if [ -n "${LOGS:-}" ] && [ -f "$LOGS/pie.log" ]; then
              count=$(awk '/OBShowcase:/ {n++} END {print n+0}' "$LOGS/pie.log")
              done=no
              if grep -Fq 'OBShowcase: done' "$LOGS/pie.log"; then done=yes; fi
              printf -- '- OBShowcase lines: %s\n- OBShowcase: done: %s\n' "$count" "$done"
              awk 'tolower($0) ~ /automation/ && tolower($0) ~ /test completed/ && tolower($0) ~ /result[[:space:]]*=/ {print}' \
                "$LOGS/pie.log" > "$LOGS/pie-results.txt"
              if [ -s "$LOGS/pie-results.txt" ]; then
                printf -- '- Automation result line present: yes\n\n```\n'
                cat "$LOGS/pie-results.txt"
                printf '```\n'
              else
                echo '- Automation result line present: no'
              fi
            else
              echo '- OBShowcase lines: not run'
              echo '- OBShowcase: done: not run'
              echo '- Automation result line present: not run'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
